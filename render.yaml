services:
  - type: web
    name: fitsense-ai-backend
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build && cd ../backend && rm -rf static_dist && cp -r ../frontend/dist static_dist && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.9.6"
      - key: NODE_VERSION
        value: "24.18.0"
      - key: ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: USE_REAL_AI
        value: "true"
      - key: USE_AI_PHOTOS
        value: "false"
      - key: USE_REAL_AI_PHOTOS
        value: "false"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_URL_BASE
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: FRONTEND_ORIGIN
        value: "capacitor://localhost,https://localhost"
